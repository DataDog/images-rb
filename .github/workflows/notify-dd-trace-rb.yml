name: Notify dd-trace-rb

# To manually re-trigger a dd-trace-rb pin update, run:
#  `gh workflow run "Notify dd-trace-rb" --ref main`

on: # yamllint disable-line rule:truthy
  workflow_run:
    workflows: ["Main"]
    types: [completed]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

# Default permissions for all jobs
permissions: {}

jobs:
  notify:
    name: "Notify dd-trace-rb"
    runs-on: ubuntu-24.04
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    permissions:
      id-token: write
    steps:
      - name: Determine trigger inputs
        id: inputs
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "commit=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "triggered_by=manual" >> "$GITHUB_OUTPUT"
          else
            echo "commit=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
            echo "triggered_by=merge" >> "$GITHUB_OUTPUT"
          fi
          echo "run_url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$GITHUB_OUTPUT"

      - name: Get GitHub Token via dd-octo-sts
        id: generate-token
        uses: DataDog/dd-octo-sts-action@96a25462dbcb10ebf0bfd6e2ccc917d2ab235b9a # v1.0.4
        with:
          scope: DataDog/dd-trace-rb
          policy: images-rb.notify-dd-trace-rb

      # There appers to be a race condition; wait it out a bit
      # See: https://datadoghq.atlassian.net/browse/APMLP-1305
      - name: Wait for token propagation
        run: sleep 30

      - name: Dispatch to dd-trace-rb
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          gh api repos/DataDog/dd-trace-rb/dispatches \
            -f event_type=images-updated \
            -f "client_payload[commit]=${{ steps.inputs.outputs.commit }}" \
            -f "client_payload[source_run_url]=${{ steps.inputs.outputs.run_url }}" \
            -f "client_payload[triggered_by]=${{ steps.inputs.outputs.triggered_by }}"
